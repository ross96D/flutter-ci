name: Build flutter engine (linux x64)

on:
  push:
    tags:
      - "engine/*"
  pull_request:
    branches: [ci]
  repository_dispatch:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  XZ_DEFAULTS: "-T 0"
  GCLIENT_PY3: 1
  DEPOT_TOOLS_UPDATE: 0

jobs:
  resolve-version:
    name: "Resolve relevant flutter versions"
    runs-on: ubuntu-latest
    outputs:
      # semver of the Flutter SDK that is using this engine.
      semver: ${{ steps.resolve.outputs.first-semver }}

      # Commit hash of the Flutter SDK that is using this engine.
      engine-hash: ${{ steps.resolve.outputs.engine-hash }}

      channel: ${{ steps.resolve.outputs.channel }}

      is-stable: ${{ steps.resolve.outputs.is-stable }}
      is-beta: ${{ steps.resolve.outputs.is-beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve flutter hash & SDK version
        id: resolve
        run: |
          set -euo pipefail

          # If debugging is enabled, trace bash commands
          if ${{ runner.debug && 'true' || 'false' }}; then
            set -x
          fi

          STABLE_REF="$(git tag --points-at HEAD 'flutter/stable/*' | cut -f1 | cut -d/ -f3)"
          BETA_REF="$(git tag --points-at HEAD 'flutter/beta/*' | cut -f1 | cut -d/ -f3)"

          if test -n "$STABLE_REF"; then
            echo "is-stable=true" >> $GITHUB_OUTPUT
            echo "is-beta=false" >> $GITHUB_OUTPUT
            echo "first-semver=$STABLE_REF" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
            CHANNEL=stable
          elif test -n "$BETA_REF"; then
            echo "is-stable=false" >> $GITHUB_OUTPUT
            echo "is-beta=true" >> $GITHUB_OUTPUT
            echo "first-semver=$BETA_REF" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
            CHANNEL=beta
          elif ${{ startsWith(github.ref, 'refs/pull') && 'true' || 'false' }}; then
            echo "is-stable=true" >> $GITHUB_OUTPUT
            echo "is-beta=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
            CHANNEL=stable
          else
            echo "Could not determine channel."
            exit 1
          fi

          # read the flutter.version file to find the flutter hash
          # that we're building for
          ENGINE_HASH=$(cat flutter.version.$CHANNEL | tr -dc [:xdigit:])

          echo "engine-hash=$ENGINE_HASH" >> $GITHUB_OUTPUT

  populate-engine-src-cache:
    name: "Prepopulate engine source cache"
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.preloadindex true

      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        id: cache-lookup
        with:
          path: flutter
          key: flutter-${{ needs.resolve-version.outputs.engine-hash }}-${{ runner.os }}-${{ runner.arch }}
          lookup-only: true

      - name: Install depot tools
        id: cache-depot-tools
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/depot_tools
          key: ${{ runner.os }}-${{ runner.arch }}-depot-tools

      - name: Populate googlesource git cookies
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        env:
          GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
        run: |
          if [ -n "$GOOGLESOURCE_COOKIE" ]; then
            eval "$GOOGLESOURCE_COOKIE"
          fi

      - name: Clone depot_tools (if not cached)
        if: steps.cache-lookup.outputs.cache-hit != 'true' && steps.cache-depot-tools.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ./depot_tools

      - name: Save depot_tools
        if: steps.cache-lookup.outputs.cache-hit != 'true' && steps.cache-depot-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/depot_tools
          key: ${{ runner.os }}-${{ runner.arch }}-depot-tools

      - name: Setup depot_tools
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        run: |
          echo $GITHUB_WORKSPACE/depot_tools >> $GITHUB_PATH

      - name: Print depot_tools debug info
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        run: |
          echo path:
          echo $PATH
          echo
          echo which python3:
          which python3
          echo
          echo python3 version:
          python3 --version

      - name: Bootstrap flutter environment
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        run: |
          mkdir -p flutter
          cp dot-gclient.py flutter/.gclient

      - name: Install flutter sources
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        working-directory: flutter
        env:
          DEPOT_TOOLS_UPDATE: 1
        run: |
          gclient sync --no-history --shallow --revision .@${{ needs.resolve-version.outputs.engine-hash }} -R -D

      - name: Install linux sysroot
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        working-directory: flutter/engine/src/build/linux/sysroot_scripts
        run: |
          ./install-sysroot.py --arch=amd64

      - name: Delete unneeded dependencies
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        working-directory: flutter/engine/
        run: |
          rm -rf src/fuchsia

      - name: Prune git history
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        working-directory: flutter
        run: |
          for FILE in $(find . -type d -name .git)
          do
            pushd "$FILE/.."
            git rev-parse HEAD > .git/shallow
            git tag -d $(git tag -l) || true
            for ref in $(git for-each-ref --format="%(refname)")
            do
              git update-ref -d "$ref"
            done
            git remote remove origin
            git reflog expire --expire=all --all
            git gc --prune=all
            popd
          done

      - uses: actions/cache/save@v4
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        env:
          ZSTD_CLEVEL: 12
        with:
          path: flutter
          key: flutter-${{ needs.resolve-version.outputs.engine-hash }}-${{ runner.os }}-${{ runner.arch }}

  build:
    name: "Build linux-x64-${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: [resolve-version, populate-engine-src-cache]
    strategy:
      matrix:
        include:
          - name: release-fast
            runtime-mode: release
            optimize-for-size: false
            unoptimized: false
            stripped: false
            sanitizers: ""

          - name: release-small
            runtime-mode: release
            optimize-for-size: true
            unoptimized: false
            stripped: true
            sanitizers: ""

          - name: debug
            runtime-mode: debug
            optimize-for-size: false
            unoptimized: true
            stripped: false
            sanitizers: "--asan --lsan --ubsan"
    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.preloadindex true

      - uses: actions/checkout@v4

      - name: Log engine version & Build config
        run: |
          echo '*** flutter engine hash: ***'
          echo ${{ needs.resolve-version.outputs.engine-hash }}
          echo '*** flutter version: ***'
          echo ${{ needs.resolve-version.outputs.semver }}

          echo '*** build variant: ***'
          echo name: ${{ matrix.name }}
          echo runtime-mode: ${{ matrix.runtime-mode }}
          echo optimize-for-size: ${{ matrix.optimize-for-size }}
          echo unoptimized: ${{ matrix.unoptimized }}
          echo stripped: ${{ matrix.stripped }}
          echo sanitizers: ${{ matrix.sanitizers }}

          echo "GITHUB_WORKSPACE_UNIX=$(realpath .)" >> $GITHUB_ENV
          echo "BUILD_DIR=$(realpath .)/flutter/engine/src/out/build" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Cache depot tools
        id: cache-depot-tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/depot_tools
          key: ${{ runner.os }}-${{ runner.arch }}-depot-tools

      - name: Populate googlesource git cookies
        env:
          GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
        run: |
          if [ -n "$GOOGLESOURCE_COOKIE" ]; then
            eval "$GOOGLESOURCE_COOKIE"
          fi

      - name: Clone depot tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ./depot_tools

      - name: add depot_tools to path
        run: |
          echo "${{ github.workspace }}/depot_tools" >> $GITHUB_PATH

      - name: Run gclient --version
        env:
          DEPOT_TOOLS_UPDATE: 1
        run: |
          gclient --version

      - name: Download cached engine sources
        uses: actions/cache/restore@v4
        id: cache
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: flutter
          key: flutter-${{ needs.resolve-version.outputs.engine-hash }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install workflow_tool dependencies
        working-directory: workflow_tool
        run: dart pub get

      - name: Tag flutter repository
        working-directory: flutter
        run: |
          # Tag the Flutter repo at current commit
          git tag -f unpatched-flutter

      - name: Apply patches
        run: |
          dart run $GITHUB_WORKSPACE_UNIX/workflow_tool/bin/patch.dart apply \
            $GITHUB_WORKSPACE_UNIX/patches/patches.json \
            $GITHUB_WORKSPACE_UNIX/flutter

      - name: Soft reset flutter repository
        working-directory: flutter
        run: |
          # Soft reset Flutter repo to preserve version but keep changes
          git reset --soft unpatched-flutter

      - name: Configure engine
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            --runtime-mode ${{ matrix.runtime-mode }} \
            --target-os linux \
            --linux-cpu x64 \
            --target-dir build \
            --embedder-for-target \
            --disable-desktop-embeddings \
            --no-build-glfw-shell \
            --no-build-embedder-examples \
            --no-enable-unittests \
            --enable-minimal-linux \
            --enable-fontconfig \
            --no-goma \
            ${{ matrix.unoptimized && '--unoptimized' || '' }} \
            ${{ matrix.optimize-for-size && '--optimize-for-size' || '' }} \
            ${{ matrix.stripped && '--stripped' || '--no-stripped' }} \
            ${{ matrix.sanitizers }}

      - name: Build engine
        working-directory: flutter/engine/src/out/build
        run: |
          ninja libflutter_engine.so gen_snapshot flutter_embedder.h icudtl.dat

      - name: Add flutter.version and dart-sdk.version file
        run: |
          pushd $GITHUB_WORKSPACE_UNIX/flutter
          git rev-parse HEAD > $BUILD_DIR/flutter.version
          popd

          pushd $GITHUB_WORKSPACE_UNIX/flutter/engine/src/flutter/third_party/dart
          git rev-parse HEAD > $BUILD_DIR/dart-sdk.version
          popd

      - name: Package engine
        run: |
          mkdir -p pkg

          pushd pkg
          cp \
            $BUILD_DIR/libflutter_engine.so \
            $BUILD_DIR/gen_snapshot \
            $BUILD_DIR/icudtl.dat \
            $BUILD_DIR/flutter_embedder.h \
            $BUILD_DIR/flutter.version \
            $BUILD_DIR/dart-sdk.version \
            $BUILD_DIR/compile_commands.json \
            .

          tar -cJvf ../linux-x64-${{ matrix.name }}.tar.xz *
          popd

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ matrix.name }}
          path: pkg/*

      - name: Upload engine (.tar.xz)
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ matrix.name }}-tar-xz
          path: linux-x64-${{ matrix.name }}.tar.xz

  release:
    name: "Publish release"
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - run: |
          mkdir -p release-files
          mv all-artifacts/*-tar-xz/* release-files/

      # Show the complete file tree, and print all metadata (permissions, owner, group, filesize, last modification date)
      - name: Show file tree
        run: |
          sudo apt-get install -y tree
          tree -apugshDF

      - uses: softprops/action-gh-release@v2
        if: ${{ needs.resolve-version.outputs.is-stable == 'true' || needs.resolve-version.outputs.is-beta == 'true'}}
        with:
          name: ${{ needs.resolve-version.outputs.semver || needs.resolve-version.outputs.engine-hash }}
          body: |
            | variant | runtime | optimization | debug symbols | sanitizers |
            | - | - | - | - | - |
            | `release-fast` | release | speed | yes, in `.so` | none |
            | `release-small` | release | size (`--optimize-for-size`) | no, stripped | none |
            | `debug` | debug, unoptimized | none | yes, in `.so` | ASan, LSan, UBSan |

            Each bundle contains `libflutter_engine.so`, `gen_snapshot`, `icudtl.dat`,
            `flutter_embedder.h`, `flutter.version`, `dart-sdk.version` and
            `compile_commands.json`.

            | name | info | reference |
            | - | - | - |
            | flutter channel | ${{ needs.resolve-version.outputs.channel }} | |
            | flutter version | ${{ needs.resolve-version.outputs.semver || needs.resolve-version.outputs.engine-hash }} | [flutter/flutter@`${{ needs.resolve-version.outputs.semver || needs.resolve-version.outputs.engine-hash }}`](https://github.com/flutter/flutter/tree/${{ needs.resolve-version.outputs.semver || needs.resolve-version.outputs.engine-hash }}) |
            | engine version | `${{ needs.resolve-version.outputs.engine-hash }}` | [flutter/flutter@`${{ needs.resolve-version.outputs.engine-hash }}`](https://github.com/flutter/flutter/tree/${{ needs.resolve-version.outputs.engine-hash }}) |

            The engine is built with fontconfig support. The target system needs
            `libfontconfig.so.1` and at least one installed font, for example:

            ```sh
            sudo apt install fontconfig fonts-dejavu-core
            sudo fc-cache -f
            ```
          fail_on_unmatched_files: true
          files: |
            release-files/*
          prerelease: ${{ needs.resolve-version.outputs.is-stable != 'true' }}
          draft: ${{ startsWith(github.ref, 'refs/pull') }}
